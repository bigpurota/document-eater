[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[project]
name = "document-eater"
version = "0.1.0"
description = "Private, local-first document ingestion, graph, and retrieval pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "defusedxml>=0.7,<1",
  "fastembed>=0.7,<1",
  "mcp>=2,<3",
  "openpyxl>=3.1,<4",
  "pymupdf>=1.26,<2",
  "python-docx>=1.2,<2",
]

[project.scripts]
document-eater = "document_eater.cli:main"
document-eater-mcp = "document_eater.mcp_server:main"
document-eater-install-opencode = "document_eater.install_opencode:main"

[project.optional-dependencies]
quality = [
    "flagembedding>=1.3,<2",
    "transformers>=4.44,<5",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.16,<0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["artifacts", "audit-run", ".document-eater-workspace", "data", "models"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
